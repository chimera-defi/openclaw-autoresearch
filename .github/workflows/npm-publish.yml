name: Publish npm package

on:
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      release_tag:
        description: Release tag to verify, for example v1.0.9
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-publish-${{ github.event.release.tag_name || inputs.release_tag }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Resolve release tag
        id: release
        run: |
          tag="${{ github.event.release.tag_name || inputs.release_tag }}"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify release tag
        run: npm run release:check-tag -- "${{ steps.release.outputs.tag }}"

      - name: Check npm package publish state
        id: package-state
        run: |
          PACKAGE_NAME=$(node -p "require('./package.json').name")
          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          echo "package_name=${PACKAGE_NAME}" >> "$GITHUB_OUTPUT"
          echo "package_version=${PACKAGE_VERSION}" >> "$GITHUB_OUTPUT"

          if npm view "${PACKAGE_NAME}@${PACKAGE_VERSION}" version --registry https://registry.npmjs.org/ >/tmp/published-version 2>/dev/null; then
            echo "already_published=true" >> "$GITHUB_OUTPUT"
            echo "published_version=$(cat /tmp/published-version)" >> "$GITHUB_OUTPUT"
          else
            echo "already_published=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Run release verification
        run: npm run release:verify

      - name: Publish to npm with provenance
        if: steps.package-state.outputs.already_published != 'true'
        run: npm publish --provenance --access public

      - name: Report already-published package
        if: steps.package-state.outputs.already_published == 'true'
        run: |
          echo "${{ steps.package-state.outputs.package_name }}@${{ steps.package-state.outputs.package_version }} is already published; skipping npm publish."
